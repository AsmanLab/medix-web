name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    # Секрет разворачивается в переменную на уровне job намеренно: контекст
    # `secrets` в `if:` шага недоступен, и выражение `!secrets.X` не даёт
    # ошибку в логе — GitHub не может разобрать workflow и роняет весь файл
    # за 0 секунд. С 31.07 из-за этого не выполнялись ни typecheck, ни vitest,
    # ни build, ни e2e, ни Lighthouse: все проверки витрины молчали, а PR
    # выглядели зелёными, потому что обязательных проверок просто не было.
    # Контекст `env` в `if:` шага разрешён — через него и проверяем.
    env:
      E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Warn when E2E run is a no-op
        if: ${{ !env.E2E_API_BASE_URL }}
        run: |
          echo "::warning title=E2E без API::Секрет E2E_API_BASE_URL не задан — \
          сценарии будут пропущены, и зелёный статус этого job ничего не доказывает. \
          Задайте секрет, чтобы прогон стал обязательным."
      - name: Run Playwright E2E
        env:
          # E2E_API_BASE_URL приходит из env самого job (см. комментарий выше).
          # Задайте секрет, чтобы гонять сценарии против живого стенда. Без него
          # спеки пропускаются — и job печатает предупреждение выше, чтобы
          # «зелёный e2e» не читался как пройденный. Fallback на localhost убран
          # намеренно: с ним переменная всегда была непустой, и отличить
          # «API задан» от «API не задан» было нельзя.
          # Если адрес задан, недоступный API обязан ронять job, а не скипать его.
          E2E_REQUIRE_API: ${{ secrets.E2E_API_BASE_URL && '1' || '' }}
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_CLIENT_PHONE: ${{ secrets.E2E_CLIENT_PHONE }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
          E2E_MANAGER_PHONE: ${{ secrets.E2E_MANAGER_PHONE }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          E2E_ADMIN_PHONE: ${{ secrets.E2E_ADMIN_PHONE }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_OTP: ${{ secrets.E2E_OTP }}
          CI: "true"
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
